<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanchay</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #333; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #764ba2; }
        .results { margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 4px; display: none; }
        .results.show { display: block; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sanchay Supply Chain Diagnostics</h1>
        
        <div class="form-group">
            <label>Town ID:</label>
            <input type="text" id="town" value="T00001">
        </div>
        
        <div class="form-group">
            <label>Division:</label>
            <select id="div">
                <option>AC</option>
                <option>Lighting</option>
                <option>Fans</option>
            </select>
        </div>
        
        <button onclick="runTest()">Run Diagnosis</button>
        
        <div id="res" class="results">
            <h3>Results:</h3>
            <p><b>Town:</b> <span id="t"></span></p>
            <p><b>Issue:</b> <span id="i"></span></p>
            <p><b>Severity:</b> <span id="s"></span></p>
            <p><b>Action:</b> <span id="a"></span></p>
        </div>
    </div>

    <script>
        function runTest() {
            const town = document.getElementById('town').value;
            const div = document.getElementById('div').value;
            
            if (!town) {
                alert('Enter town ID');
                return;
            }
            
            fetch('https://sanchay-406748015906.us-central1.run.app/investigate?town_id=' + town + '&division=' + div, {
                method: 'POST'
            })
            .then(r => r.json())
            .then(d => {
                document.getElementById('t').innerText = d.town_id;
                document.getElementById('i').innerText = d.supervisor_verdict.primary_cause;
                document.getElementById('s').innerText = d.supervisor_verdict.severity;
                document.getElementById('a').innerText = d.supervisor_verdict.recommended_action;
                document.getElementById('res').classList.add('show');
            })
            .catch(e => alert('Error: ' + e));
        }
    </script>
</body>
</html>
